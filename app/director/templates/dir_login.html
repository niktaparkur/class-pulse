<!-- app/director/templates/dir_login.html -->
{% extends "base.html" %}

{% block title %}Вход Директора - Class Pulse{% endblock %}
{% block container_class %}login-page-wrapper{% endblock %}

{% block head_styles %}
<style>
    .login-page-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f8f9fa;
        /* Фон для всей страницы */
        padding: 20px;
        /* Отступы, чтобы контейнер не прилипал к краям на малых экранах */
    }

    .login-container {
        width: 100%;
        max-width: 400px;
        padding: 30px 40px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        color: #2980b9;
    }

    .login-container h1 {
        text-align: center;
        font-size: 1.8em;
        margin-top: 0;
        /* Убираем верхний отступ, если он есть от .container */
        margin-bottom: 25px;
        color: #333;
    }

    .login-container h1 i {
        margin-right: 10px;
        color: #007bff;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 1em;
        box-sizing: border-box;
    }


    /* Другой цвет для директора */
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <h1><i class="fas fa-user-tie"></i> Вход Директора</h1>
    {# Flash сообщения из base.html #}
    <form method="post" action="{{ url_for('director.login_route') }}">
        <div class="form-group">
            <label for="username">Имя пользователя (Директор):</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль (Директор):</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="button button-primary login-button"
            style="background-color: #2980b9; border-color: #2980b9;">Войти как Директор</button>
    </form>
</div>
{% endblock %}
